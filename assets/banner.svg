<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3" />
    </linearGradient>

    <!-- Forecast Cone Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0%, 100% { r: 4px; opacity: 0.9; }
      50% { r: 7px; opacity: 0.4; }
    }
    @keyframes scanLine {
      0% { transform: translateX(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .wave-line {
      stroke-dasharray: 800;
      animation: pulseDash 6s ease-in-out infinite alternate;
    }
    .ping-point {
      animation: pingDot 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .scanner {
      animation: scanLine 8s linear infinite;
    }
    .floating-layer {
      animation: waveFloat 5s ease-in-out infinite;
    }
  </style>

  <!-- Banner Background Rounded Card -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="100" y1="0" x2="100" y2="260" />
    <line x1="200" y1="0" x2="200" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="400" y1="0" x2="400" y2="260" />
    <line x1="500" y1="0" x2="500" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="700" y1="0" x2="700" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />
  </g>

  <!-- Dynamic Forecast Cone (Fan Chart) -->
  <path d="M 520 180 Q 640 145 880 100 L 880 230 Q 640 200 520 180 Z" fill="url(#coneGrad)" />

  <!-- Dynamic Animated Time Series Wave Curve (Background layer) -->
  <g class="floating-layer">
    <!-- Confidence interval bounds (dotted) -->
    <path d="M 20 200 Q 120 230 220 185 T 420 170 T 560 140 T 720 105 T 880 95" 
          fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
    <path d="M 20 215 Q 120 245 220 200 T 420 200 T 560 190 T 720 195 T 880 225" 
          fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

    <!-- Main Forecast Trajectory Line -->
    <path class="wave-line" d="M 20 210 Q 120 235 220 190 T 420 185 T 560 160 T 720 150 T 880 145" 
          fill="none" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)" />
  </g>

  <!-- Data Observation & Prediction Anchor Points -->
  <circle cx="220" cy="190" r="4.5" fill="#38bdf8" filter="url(#glow)" class="ping-point" />
  <circle cx="420" cy="185" r="4.5" fill="#818cf8" filter="url(#glow)" class="ping-point" />
  <circle cx="560" cy="160" r="5" fill="#a855f7" filter="url(#glow)" class="ping-point" />
  <circle cx="720" cy="150" r="5" fill="#c084fc" filter="url(#glow)" class="ping-point" />
  <circle cx="880" cy="145" r="5.5" fill="#f43f5e" filter="url(#glow)" class="ping-point" />

  <!-- Animated Scanner Bar across time horizon -->
  <rect class="scanner" y="20" width="3" height="220" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Tags (Guaranteed High Contrast & Visible) -->
  <!-- Top Badge / Pill -->
  <g transform="translate(45, 32)">
    <rect width="215" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#c7d2fe" font-size="11" font-weight="600" letter-spacing="0.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(45, 96)">
    <text x="0" y="0" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Time Series Forecasting
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(45, 126)">
    <text x="0" y="0" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Top Foundation Models, Deep Learning Libraries, AutoML &amp; SaaS Platforms
    </text>
  </g>

  <!-- Category Badges / Pills in Foreground -->
  <g transform="translate(45, 150)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="10" y="16" fill="#38bdf8" font-size="11.5" font-weight="600">📈 Foundation Models</text>

    <!-- Pill 2 -->
    <rect x="146" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="156" y="16" fill="#818cf8" font-size="11.5" font-weight="600">⚡ Automated ML</text>

    <!-- Pill 3 -->
    <rect x="282" y="0" width="144" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="292" y="16" fill="#c084fc" font-size="11.5" font-weight="600">🔮 Neural Forecasting</text>

    <!-- Pill 4 -->
    <rect x="434" y="0" width="152" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="444" y="16" fill="#34d399" font-size="11.5" font-weight="600">📊 Enterprise Platforms</text>
  </g>
</svg>
